name: DevSecOps Security Pipeline

permissions:
  contents: read
  security-events: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

# ============================================================
# Security and Quality Checks
# ============================================================

  security-checks:

    name: Security Analysis
    runs-on: ubuntu-latest


    steps:

    # --------------------------------------------------------
    # 1. Checkout
    # --------------------------------------------------------

    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        fetch-depth: 0


    # --------------------------------------------------------
    # 2. Setup Python (Semgrep)
    # --------------------------------------------------------

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  #v5.6.0
      with:
        python-version: "3.12"


    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install semgrep


    # --------------------------------------------------------
    # 3. Secret Detection
    # --------------------------------------------------------

    - name: Gitleaks - Secret Detection
      uses: gitleaks/gitleaks-action@v3.0.0 #v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: false


    # --------------------------------------------------------
    # 4. Semgrep - Blocking Security Rules
    # --------------------------------------------------------

    - name: Semgrep - Custom Security Rules
      run: |

        semgrep scan \
          --config .semgrep/blocking-rules.yml \
          --severity ERROR \
          --error



    # --------------------------------------------------------
    # 5. Semgrep - OWASP / Generic Rules
    # Non blocking
    # --------------------------------------------------------

    - name: Semgrep - OWASP Rules
      run: |

        semgrep scan \
          --config p/owasp-top-ten \
          --config p/javascript \
          --config p/typescript \
          --config p/nodejs \
          --config p/react \
          --no-error



    # --------------------------------------------------------
    # 6. Semgrep - Code Quality
    # --------------------------------------------------------

    - name: Semgrep - Quality Rules
      run: |
        semgrep scan \
          --config .semgrep/advisory-rules.yml \
          --no-error


    # --------------------------------------------------------
    # 8. Dependency Security
    # --------------------------------------------------------

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  #v4.4.0
      with:
        node-version: "22.23.1"
        cache: npm

    - name: Install Next.js dependencies
      working-directory: next-app
      run: |
        echo "=== Next.js dependency installation ==="
        node --version
        npm --version
        npm ci

    - name: Install Express dependencies
      working-directory: express-app
      run: |
        echo "=== Express dependency installation ==="
        node --version
        npm --version
        npm ci



    - name: NPM Audit - Next.js
      working-directory: next-app
      run: npm audit --audit-level=high



    - name: NPM Audit - Express
      working-directory: express-app
      run:  npm audit --audit-level=high



    # --------------------------------------------------------
    # 9. Dockerfile Security
    # --------------------------------------------------------

    - name: Hadolint - Next.js Dockerfile
      uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf #v3.1.0
      with:

        dockerfile: next-app/Dockerfile
        failure-threshold: error



    - name: Hadolint - Express Dockerfile
      uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf #v3.1.0
      with:

        dockerfile: express-app/Dockerfile
        failure-threshold: error


    # --------------------------------------------------------
    # 10. Docker Build Verification
    # --------------------------------------------------------

    - name: Build Next.js Docker Image
      run: |
        docker build \
          -t test-devsecops-next:ci \
          ./next-app

    - name: Build Express Docker Image
      run: |
        docker build \
          -t test-devsecops-express:ci \
          ./express-app

    # --------------------------------------------------------
    # 10. Application Tests
    # --------------------------------------------------------

    - name: Run Next.js Security Tests
      working-directory: next-app
      run: npm test


    - name: Run Express Security Tests
      working-directory: express-app
      run: |
        if [ ! -f package.json ]; then
        echo "No package.json found"
        exit 0
        fi

        if ! npm run | grep -q "test"; then
        echo "No test script configured"
        exit 0
        fi
        
        npm test



    # --------------------------------------------------------
    # 11. Build Verification
    # --------------------------------------------------------

    - name: Build Next.js Application
      working-directory: next-app
      run: npm run build



    - name: Validate Express Application
      working-directory: express-app
      run: |
        echo "=== Express application validation ==="
        node --check index.js