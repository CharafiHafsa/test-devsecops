name: Pipeline DevSecOps
permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code source
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire pour Gitleaks (scan de tout l'historique)

      # 2. Gitleaks – détection de secrets dans le code et l'historique Git
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        # La variable d'environnement n'est pas obligatoire pour un dépôt public
        # env:
        #   GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # 3. Semgrep – analyse statique avec règles customs + règles de base
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"

      - name: Install Semgrep
        run: |
            python -m pip install --upgrade pip
            pip install semgrep

      - name: Semgrep - Custom Rules (Blocking)
        run: |
            semgrep scan \
            --config .semgrep/custom-rules.yml \
            --error

      - name: Semgrep - OWASP Rules (Report Only)
        run: |
            semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --config p/react \
            --sarif \
            --output semgrep.sarif \
            --no-error

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
            sarif_file: semgrep.sarif

      # 4. Hadolint sur le Dockerfile de l'application Next.js
      - name: Hadolint Next.js
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: next-app/Dockerfile
          failure-threshold: warning

      # 5. Hadolint sur le Dockerfile de l'application Express
      - name: Hadolint Express
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: express-app/Dockerfile
          failure-threshold: warning