name: DevSecOps Security Pipeline

permissions:
  contents: read
  security-events: write
  pull-requests: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

# ============================================================
# Security and Quality Checks
# ============================================================

  security-checks:

    name: Security Analysis
    runs-on: ubuntu-latest


    steps:

    # --------------------------------------------------------
    # 1. Checkout
    # --------------------------------------------------------

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    # --------------------------------------------------------
    # 2. Setup Python (Semgrep)
    # --------------------------------------------------------

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install semgrep


    # --------------------------------------------------------
    # 3. Secret Detection
    # --------------------------------------------------------

    - name: Gitleaks - Secret Detection
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    # --------------------------------------------------------
    # 4. Semgrep - Blocking Security Rules
    # --------------------------------------------------------

    - name: Semgrep - Custom Security Rules
      run: |

        semgrep scan \
          --config .semgrep/blocking-rules.yml \
          --severity ERROR \
          --error



    # --------------------------------------------------------
    # 5. Semgrep - OWASP / Generic Rules
    # Non blocking
    # --------------------------------------------------------

    - name: Semgrep - OWASP Rules
      continue-on-error: true
      run: |

        semgrep scan \
          --config p/owasp-top-ten \
          --config p/javascript \
          --config p/typescript \
          --config p/nodejs \
          --config p/react \
          --no-error



    # --------------------------------------------------------
    # 6. Semgrep - Code Quality
    # --------------------------------------------------------

    - name: Semgrep - Quality Rules
      continue-on-error: true
      run: |

        semgrep scan \
          --config .semgrep/advisory-rules.yml \
          --no-error


    # --------------------------------------------------------
    # 8. Dependency Security
    # --------------------------------------------------------

    - name: Install Next.js dependencies
      working-directory: next-app
      run: npm ci

    - name: Install Express dependencies
      working-directory: express-app
      run: npm ci



    - name: NPM Audit - Next.js
      working-directory: next-app
      run: npm audit --audit-level=high



    - name: NPM Audit - Express
      working-directory: express-app
      run:  npm audit --audit-level=high



    # --------------------------------------------------------
    # 9. Dockerfile Security
    # --------------------------------------------------------

    - name: Hadolint - Next.js Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:

        dockerfile: next-app/Dockerfile
        failure-threshold: error



    - name: Hadolint - Express Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:

        dockerfile: express-app/Dockerfile
        failure-threshold: error



    # --------------------------------------------------------
    # 10. Application Tests
    # --------------------------------------------------------

    - name: Run Next.js Security Tests
      working-directory: next-app
      run: |
        if [ ! -f package.json ]; then
        echo "No package.json found"
        exit 0
        fi

        if ! npm run | grep -q "test"; then
        echo "No test script configured"
        exit 0
        fi

        npm ci
        npm test


    - name: Run Express Security Tests
      working-directory: express-app
      run: |
        if [ ! -f package.json ]; then
        echo "No package.json found"
        exit 0
        fi

        if ! npm run | grep -q "test"; then
        echo "No test script configured"
        exit 0
        fi

        npm ci
        npm test



    # --------------------------------------------------------
    # 11. Build Verification
    # --------------------------------------------------------

    - name: Build Next.js Application
      working-directory: next-app
      run: |

        npm run build



    - name: Validate Express Application
      working-directory: express-app
      run: |

        npm run build || true